# Test gate for the Railway deploy: with "Wait for CI" enabled on the Railway
# service, a red run here blocks the deploy of that commit (see docs/DEPLOY.md).
# NOTE: the 28 wall-clock endpoint tests are red until LAUNCH_DATE (2026-08-01
# UTC) by explicit choice — the first green run arrives on launch day.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.33" # matches the Dockerfile's pinned uv
      - run: uv sync --frozen
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
