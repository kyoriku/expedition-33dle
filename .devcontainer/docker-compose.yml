# .devcontainer/docker-compose.yml
#
# Orchestrates three services for local development:
#   - volume-init: Runs once at startup, fixes ownership on named volumes
#                  so the non-root vscode user can write to them. Exits when done.
#   - dev:        Container where Claude Code runs (Python + Node + uv + claude CLI)
#   - postgres:   Database, internal to this project's network (not published to
#                 the Mac), data persisted in a named volume

services:
  volume-init:
    image: alpine:3.20
    command: >
      sh -c "chown -R 1000:1000 /init/venv /init/node_modules && echo 'volume permissions set'"
    volumes:
      - server-venv:/init/venv
      - client-node-modules:/init/node_modules

  dev:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm

    volumes:
      # Bind-mount the repo. `cached` is a macOS optimization — host is the
      # source of truth, container reads are cached. Big perf win for hot reload.
      - ..:/workspaces/expedition-33dle:cached

      # Named volumes for container-managed artifacts. Permissions fixed by
      # volume-init before this container starts.
      - server-venv:/workspaces/expedition-33dle/server/.venv
      - client-node-modules:/workspaces/expedition-33dle/client/node_modules

    command: sleep infinity

    # Offset ports so this runs alongside SBG without collision.
    ports:
      - "3001:3001"
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/expedition33dle

    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expedition33dle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published ports: reach it from the dev container or other containers on
    # this network at postgres:5432, or from the Mac with docker exec ... psql.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expedition33dle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  server-venv:
  client-node-modules: