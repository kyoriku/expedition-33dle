<!doctype html>
<!-- Source of truth for public/og-image.png — see README.md for the render command. -->
<html>
<head>
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:radial-gradient(ellipse at 30% 15%, #1c1917 0%, #0c0a09 65%);font-family:system-ui,'Segoe UI',sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:38px}
h1{font-size:92px;font-weight:800;color:#e3b341;letter-spacing:-2px;text-shadow:0 2px 24px rgba(227,179,65,.25)}
p{font-size:30px;color:#c8b27c}
.row{display:flex;gap:12px}
.cell{width:130px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:600}
.g{background:#16a34a}.y{background:#eab308;color:#18181b}.x{background:#52525b}
.url{position:absolute;bottom:34px;font-size:24px;color:#78716c;letter-spacing:1px}
</style>
</head>
<body>
<h1>Expedition 33dle</h1>
<p>Guess the daily Clair Obscur: Expedition 33 character</p>
<div class="row">
  <div class="cell g">Gender</div><div class="cell y">Age ?</div><div class="cell x">Class</div>
  <div class="cell x">Weapon</div><div class="cell y">Element</div><div class="cell g">Act</div>
</div>
<div class="url">expedition33dle.com</div>
</body>
</html>
